name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  format:
    name: Runic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.12'
      - uses: julia-actions/cache@v2
      - name: Install pinned formatter
        run: julia --project=tools -e 'using Pkg; Pkg.instantiate()'
      - name: Check Julia formatting
        run: julia --project=tools tools/format.jl
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10.12'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: actions/checkout@v6
        with:
          repository: EHTJulia/AbstractFastHartleyTransforms.jl
          ref: 1b951275df6b397f87c3a951f79ed80c89afa9d6
          path: .ci/AbstractFastHartleyTransforms
      - name: Use the companion package checkout
        run: julia --project -e 'using Pkg; Pkg.develop(path=".ci/AbstractFastHartleyTransforms")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_ORG_TOKEN }}
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: actions/checkout@v6
        with:
          repository: EHTJulia/AbstractFastHartleyTransforms.jl
          ref: 1b951275df6b397f87c3a951f79ed80c89afa9d6
          path: .ci/AbstractFastHartleyTransforms
      - name: Use the companion package for documentation
        run: julia --project -e 'using Pkg; Pkg.develop(path=".ci/AbstractFastHartleyTransforms")'
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path=".ci/AbstractFastHartleyTransforms")])
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using FastHartleyTransform, AbstractFastHartleyTransforms
          DocMeta.setdocmeta!(FastHartleyTransform, :DocTestSetup, :(using FastHartleyTransform); recursive=true)
          doctest(FastHartleyTransform)
  reactant:
    name: Reactant CPU
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: EHTJulia/AbstractFastHartleyTransforms.jl
          ref: 1b951275df6b397f87c3a951f79ed80c89afa9d6
          path: .ci/AbstractFastHartleyTransforms
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.12'
      - uses: julia-actions/cache@v2
      - name: Install Reactant test dependencies
        run: julia --project=test/reactant -e 'using Pkg; Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path=".ci/AbstractFastHartleyTransforms")]); Pkg.instantiate()'
      - name: Test compiled transforms and differentiation
        run: julia --code-coverage=user --project=test/reactant test/reactant/runtests.jl
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_ORG_TOKEN }}
